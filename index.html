<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tug of War Math Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main>

  <!-- TIMER -->
<div class="timer" id="timer">Time: 0s</div>

<!-- START BUTTON -->
<div id="startContainer" style="text-align:center; margin-top: 50px;">
  <button id="startBtn">Start Game</button>
</div>

  <!-- GAME PANELS AND CANVAS -->
  <div class="game-container">

    <div class="quiz-panel">
      <h2>Player Left</h2>
      <div class="question" id="leftQuestion"></div>
      <div class="options" id="leftOptions"></div>
    </div>

    <div class="stage-wrapper">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div class="quiz-panel">
      <h2>Player Right</h2>
      <div class="question" id="rightQuestion"></div>
      <div class="options" id="rightOptions"></div>
    </div>

  </div>

</main>

<!-- WINNER POPUP MODAL -->
<div class="modal" id="winModal">
  <div class="modal-box">
    <h2 id="winText">Winner</h2>
    <button onclick="closeModal()">Play Again</button>
  </div>
</div>

<!-- FOOTER -->
<footer>
  Built by <a href="https://agunechemba.name.ng" target="_blank">Agunechemba</a>
</footer>

<script src="script.js"></script>
</body>
</html>
